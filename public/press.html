<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Press — To Hold a Mountain</title>
  <link rel="icon" href="favicon.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="listings.css">
</head>
<body>
  <main class="page-main listing-page">
    <h1>Press</h1>

    <!-- One row per article, from the "Press" tab of the Google Sheet (sheet.js): the
         headings show at once, the rows once it has been read. A LINK column there makes
         the whole row a link. -->
    <table class="listing" data-sheet="press">
      <thead>
        <tr><th scope="col">Date</th><th scope="col">Publisher</th><th scope="col">Title</th><th scope="col" class="type">Type</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="menu.js"></script>
  <script src="sheet.js"></script>
</body>
