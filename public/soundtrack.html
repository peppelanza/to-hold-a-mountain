<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Soundscape — To Hold a Mountain</title>
  <meta name="description" content="Listen to the original score of To Hold a Mountain by Drasko Adzic.">
  <link rel="canonical" href="https://toholdamountain.com/soundtrack.html">
  <!-- What Facebook, WhatsApp, LinkedIn, X show when the page is shared: the logo on the sky. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="To Hold a Mountain">
  <meta property="og:title" content="Soundscape — To Hold a Mountain">
  <meta property="og:description" content="Listen to the original score of To Hold a Mountain by Drasko Adzic.">
  <meta property="og:url" content="https://toholdamountain.com/soundtrack.html">
  <meta property="og:image" content="https://toholdamountain.com/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="To Hold a Mountain — a film by Biljana Tutorov &amp; Petar Glomazić">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="soundtrack.css">
</head>
<body>
  <!-- Background: grass in the wind, looping silently (its end cross-fades into its start);
       a plain colour over it until it plays, then that fades away. -->
  <video class="bg-video" src="bg3.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
  <div class="bg-shade"></div>
  <div class="bg-cover"></div>

  <main class="player-page">
    <p class="eyebrow">Original score</p>
    <h1>The Last Ones (Outro)</h1>
    <p class="composer">Drasko Adzic</p>

    <!-- A plain <audio> element does the playing (works on every browser and phone);
         the controls below are drawn on top of it. -->
    <audio src="soundtrack.mp3" preload="metadata"></audio>

    <div class="player">
      <button class="play" type="button" aria-label="Play">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <div class="track">
        <div class="wave" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <canvas></canvas>
        </div>
        <div class="times"><span class="current">0:00</span><span class="duration">0:00</span></div>
      </div>
    </div>
  </main>

  <script src="menu.js"></script>
  <script src="soundtrack.js"></script>
</body>
</html>
