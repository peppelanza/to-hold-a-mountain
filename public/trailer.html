<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trailer — To Hold a Mountain</title>
  <link rel="icon" href="favicon.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
  <style>
    /* The trailer, as large as the screen allows (16:9), under the heading. */
    .trailer-page { max-width: 72rem; padding-bottom: 12vh; } /* as Screenings and Press */
    .trailer-page .player {
      margin-top: 2.5rem;
      width: min(100%, calc((100vh - 330px) * 16 / 9)); /* the whole player on screen, under the heading */
      aspect-ratio: 16 / 9;
      background: #000;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    }
    .trailer-page iframe { display: block; width: 100%; height: 100%; border: 0; }
    @media (max-width: 767px) { .trailer-page .player { width: 100%; margin-top: 1.5rem; } }
  </style>
</head>
<body>
  <main class="page-main trailer-page">
    <h1>Trailer</h1>
    <!-- Not started on its own: a play the viewer starts counts as a view on YouTube. -->
    <div class="player">
      <iframe src="https://www.youtube-nocookie.com/embed/SKabqo5MiE8?rel=0&playsinline=1&modestbranding=1" title="To Hold a Mountain — trailer" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
    </div>
  </main>
  <script src="menu.js"></script>
</body>
</html>
